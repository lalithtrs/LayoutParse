model:
  pretrained_model_name: "microsoft/layoutlmv3-base"
  num_labels: 9

training:
  learning_rate: 2.0e-5
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  num_train_epochs: 10
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: true
  dataloader_num_workers: 2
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "overall_f1"
  greater_is_better: true
  logging_steps: 25

tracking:
  tracker: "mlflow"  # "mlflow" or "wandb"
  experiment_name: "layoutlmv3_sroie_kie"
  run_name: "layoutlmv3_base_sroie_run1"
  log_artifacts: true


