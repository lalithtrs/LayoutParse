[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docuextract"
version = "0.1.0"
description = "Document AI Invoice/Receipt OCR & Key Information Extraction"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Lalith" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "src",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "notebooks",
    "checkpoints",
    "models",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "F401", "F841", "E741"]

[tool.black]
line-length = 100
target-version = ['py310']
