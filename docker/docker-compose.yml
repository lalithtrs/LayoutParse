services:
  docuextract-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: docuextract_api
    ports:
      - "8000:8000"
      - "80:8000"
    environment:
      - LOG_LEVEL=INFO
      - OCR_ENGINE=paddle
    volumes:
      - ../src:/app/src:ro
      - ../configs:/app/configs:ro
      - ../models:/app/models:ro
      - ../logs:/app/logs:rw
    restart: unless-stopped

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: docuextract_mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow-artifacts/mlflow.db
      --default-artifact-root /mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow-artifacts
    restart: unless-stopped

volumes:
  mlflow_data:
